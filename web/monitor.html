<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http://www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%233884ff%22%20stroke-width%3D%221.9%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%226.5%22%20y%3D%226.5%22%20width%3D%2211%22%20height%3D%2211%22%20rx%3D%222.6%22/%3E%3Cpath%20d%3D%22M9.5%206.5V3.6M12%206.5V3.6M14.5%206.5V3.6M9.5%2017.5v2.9M12%2017.5v2.9M14.5%2017.5v2.9M6.5%209.5H3.6M6.5%2012H3.6M6.5%2014.5H3.6M17.5%209.5h2.9M17.5%2012h2.9M17.5%2014.5h2.9%22/%3E%3Cpath%20d%3D%22M8.7%2012h1.3l1.1-2.4%201.7%204.7%201.1-2.3h1.5%22%20stroke-width%3D%221.7%22/%3E%3C/g%3E%3C/svg%3E">
  <title>Now Monitor</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap");

    :root {
      --console-font: "JetBrains Maple Mono", "JetBrains Mono", monospace;
      --fallback-fonts: "Noto Sans SC", sans-serif;

      /* Nord Console 配色方案 */
      --bg-color: #1b1d24;
      --prompt-user: #d08770;
      --prompt-symbol: #81a1c1;
      --label-color: #ebcb8b;
      --text-color: #eceff4;
      --dim-color: #cdd6e4;
      --chip-label: #8fbcbb;
      --subtext-color: #4c566a;   /* 只用于进度条底槽，深色底上不做文字色 */

      --bar-bg: #2e3440;
      --bar-fill: #a3be8c;
      --bar-high: #bf616a;

      /* 圆环仪表：直径按部件 size 由 JS 覆盖，这里给默认值供静态引用 */
      --gauge-size: 120px;

      /* 全局动画口径（毫秒）：数值条/曲线/圆环的过渡时长单点。
         canvas 侧的 ANIM_MS（web/overlay/core.js）与此同值，改必同改。 */
      --anim-ms: 400ms;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--console-font), var(--fallback-fonts) !important;
    }

    body {
      /* 宽高与内边距由 overlay 配置决定，这里只是兜底 */
      width: 2000px;
      height: 200px;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 12px 24px;
    }

    /* AIDA64 数据断了就把整条压暗，直播时一眼能看出来 */
    body.offline { opacity: 0.45; }

    /* 背景透明（canvas.transparent）：OBS 浏览器源直接透出游戏画面 */
    body.transparent { background-color: transparent; }

    /* 只剩 Windows 自带指标：轻度提示，数字还在动，不能压太暗 */
    body.degraded { opacity: 0.75; }

    .prompt-line {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .prompt-user { color: var(--prompt-user); }
    .prompt-symbol { color: var(--prompt-symbol); }
    .prompt-cmd { color: var(--text-color); }
    .cursor {
      display: inline-block;
      width: 10px;
      height: 20px;
      background-color: var(--text-color);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* minmax(0,1fr) 是必需的：默认 1fr 的最小宽度等于内容宽度，
       长文本会把列撑宽去挤相邻卡片，还会让溢出判据量到一个跟着变大的 room */
    .monitor-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 32px;
    }

    /* 自由画布（canvas.mode=free）：部件按 x/y 绝对定位 */
    body.free { display: block; }
    body.free > * { position: absolute; margin: 0; }

    .free-stat { font-weight: 700; white-space: nowrap; }
    .free-stat .tmiss { color: var(--subtext-color); }
    /* 原子件进度条直接复用卡片的 .progress-track/.progress-fill（动画与告警色同源）；
       圆角默认 4px 由工厂内联写死保底（卡片类的 2px 默认不动） */
    .free-progress.high .progress-fill { background: var(--bar-high); }
    .free-html { line-height: 1.3; }
    .free-html .tmiss { color: var(--subtext-color); }
    .free-gauge { text-align: center; }
    .free-gauge svg { display: block; }
    .free-gauge .gauge-mid {
      position: absolute; left: 0; right: 0; top: 0; height: var(--gauge-size, 120px);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: var(--text-color);
    }
    /* 圆环数值与告警色平滑过渡：dashoffset 走 update() 的 setAttribute，
       stroke 走 .high 类切换 —— CSS transition 对两者都生效（实测） */
    .gauge-arc { transition: stroke-dashoffset var(--anim-ms) ease, stroke var(--anim-ms) ease; }
    .free-gauge.high .gauge-arc { stroke: var(--bar-high) !important; }
    .free-gauge .gauge-label { display: block; margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--dim-color); }


    .metric-card {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }
    .metric-header { display: flex; justify-content: space-between; font-size: 17px; font-weight: bold; }
    .metric-label { color: var(--label-color); }
    /* F3：前缀/数值/后缀同一段文本 —— pre-wrap 保住 \n 换行与首尾空格 */
    .metric-value { color: var(--text-color); white-space: pre-wrap; }

    .progress-bar-container { display: flex; align-items: center; gap: 8px; font-size: 15px; }
    .progress-track {
      flex: 1;
      height: var(--bar-h, 13px);
      background-color: var(--bar-bg);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--bar-fill);
      /* height 过渡给竖向 progress 用（N2/D3-A），横条 height 恒 100% 无观感变化 */
      transition: width var(--anim-ms) ease, height var(--anim-ms) ease, background-color var(--anim-ms) ease;
    }

    .metric-sub {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--dim-color);
      white-space: nowrap;
      overflow: hidden;
    }
    /* span 必须是滚动容器，否则 scrollWidth 恒等于 clientWidth，测不出真实内容宽度 */
    /* F3：小字槽同样承载 前缀+数值+后缀 —— pre-wrap 保换行与首尾空格 */
    .metric-sub > span { overflow: hidden; white-space: pre-wrap; }
    /* 值变宽时（显存 10.0GB、核心 2000MHz）降一号，宁可小一点也不越界压到相邻卡片 */
    .metric-card.tight .metric-sub { font-size: 12.5px; }

    .spark {
      display: flex;
      align-items: flex-end;
      gap: 1px;
      flex: 0 0 82px;
      height: 17px;
      background-color: var(--bar-bg);
      padding: 1px;
    }
    .spark i { flex: 1; min-height: 1px; background-color: var(--bar-fill); transition: height var(--anim-ms) ease; }

    .chips { display: flex; justify-content: space-between; gap: 18px; margin-top: 10px; font-size: 15px; }
    .chips.dense { font-size: 13px; gap: 10px; }
    .chip { flex: 0 0 auto; display: flex; gap: 6px; white-space: nowrap; overflow: hidden; }
    .chip b { color: var(--chip-label); font-weight: 400; }
    .chip span { color: var(--text-color); }
    .chip.warn span { color: var(--bar-high); }

    .text-line { font-size: 19px; color: var(--text-color); white-space: nowrap; overflow: hidden; }
    .text-line .tv { color: var(--label-color); }
    .text-line .tmiss { color: var(--subtext-color); }

    .free-value { white-space: nowrap; overflow: hidden; }
    /* F3：.vn 前缀、.vs 后缀 —— pre-wrap 保住 \n 换行与首尾空格（数值 .vv 不受波及） */
    .free-value .vn { color: var(--label-color); white-space: pre-wrap; }
    .free-value .vs { color: var(--text-color); white-space: pre-wrap; }
    .free-value .vv { color: var(--text-color); }
    .free-value .vwarn { color: var(--bar-high); }
    .free-value .tmiss { color: var(--subtext-color); }

    /* 原子件（Phase 3）：icon / image / divider / badge */
    .free-icon svg { display: block; }
    .free-image img { width: 100%; height: 100%; display: block; }
    .free-image .img-empty {
      display: flex; width: 100%; height: 100%;
      align-items: center; justify-content: center;
      border: 1px dashed var(--subtext-color);
      color: var(--subtext-color); font-size: 12px;
    }
    .free-divider { background: var(--dim-color); }
    .free-badge {
      display: inline-flex; align-items: center; white-space: nowrap;
      background: var(--bar-bg); border-radius: 999px; padding: 3px 12px;
    }
    .free-badge .tmiss { color: var(--subtext-color); }

    /* N3：状态灯 —— 三态色全走主题变量（常态/告警/缺数据灰点），时长走 --anim-ms */
    .free-light { display: inline-flex; align-items: center; gap: 7px; }
    .free-light .light-dot { border-radius: 999px; background: var(--bar-fill); transition: background-color var(--anim-ms) ease; }
    .free-light.high .light-dot { background: var(--bar-high); }
    .free-light.tmiss .light-dot { background: var(--subtext-color); }
    .free-light .light-label { font-size: 15px; color: var(--label-color); }

    /* P1：动态图标 —— 三态色同状态灯走主题变量（常态文字色 / 告警 --bar-high /
       缺数据 --subtext-color），工厂只切类名、绝不写 inline stroke（inline 优先级
       会压死下面两条覆盖）。.tmiss 放最后：与 .high 同特异度，靠顺序盖住。 */
    .free-dynicon svg { display: block; stroke: var(--text-color); }
    .free-dynicon.high svg { stroke: var(--bar-high); }
    .free-dynicon.tmiss svg { stroke: var(--subtext-color); }
    /* style.fade 默认关：淡入只在重建 svg 节点时重放，时长走 --anim-ms 单点 */
    .free-dynicon.fade svg { animation: dynicon-in var(--anim-ms) ease; }
    @keyframes dynicon-in { from { opacity: 0; } to { opacity: 1; } }

    /* P2：表格 —— 列宽由同一份 grid-template-columns 决定（跨行对齐是它存在的理由，
       多个原子件拼不出）。条/灯/状态图标三列直接复用 .progress-track / .free-light /
       .free-dynicon 的类与色键，这里只写骨架、字号与斑马纹，不新增任何颜色字面量。 */
    .free-table { display: flex; flex-direction: column; }
    .free-table .table-row { display: grid; align-items: center; gap: 10px; }
    .free-table .table-cell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
    .free-table .tc-value { white-space: pre-wrap; }        /* F3 的 \n 换行在格子里也成立 */
    .free-table .tc-light, .free-table .tc-icon { justify-self: center; }
    .free-table .tc-bar .progress-track { height: var(--bar-h, 8px); }   /* 表里的条比卡片细一档，style.bar_h 照样能覆盖 */
    .free-table .table-head .table-cell { font-size: 14px; color: var(--label-color); opacity: .7; }
    .free-table.zebra .table-row.odd { background: var(--bar-bg); }

    /* N3：堆叠条 —— 分段宽度过渡走 --anim-ms；轨道色 = --bar-bg（外观 track 覆盖）；
       全缺/全零整条 .tmiss 压暗 */
    .free-stackbar { display: flex; overflow: hidden; background: var(--bar-bg); }
    .free-stackbar.tmiss { opacity: 0.5; }
    .free-stackbar .stack-seg { height: 100%; width: 0%; transition: width var(--anim-ms) ease; }
  </style>
</head>
<body>
  <!-- 配置驱动的叠加层渲染器：逻辑全在 /overlay/ 下的 ES module（零构建、零框架，
       OBS 的 CEF 原生支持）。本壳只留兜底 CSS；OBS 的 URL 与渲染语义不变。 -->
  <script type="module" src="/overlay/main.js"></script>
</body>
</html>
