<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http://www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%233884ff%22%20stroke-width%3D%221.9%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%226.5%22%20y%3D%226.5%22%20width%3D%2211%22%20height%3D%2211%22%20rx%3D%222.6%22/%3E%3Cpath%20d%3D%22M9.5%206.5V3.6M12%206.5V3.6M14.5%206.5V3.6M9.5%2017.5v2.9M12%2017.5v2.9M14.5%2017.5v2.9M6.5%209.5H3.6M6.5%2012H3.6M6.5%2014.5H3.6M17.5%209.5h2.9M17.5%2012h2.9M17.5%2014.5h2.9%22/%3E%3Cpath%20d%3D%22M8.7%2012h1.3l1.1-2.4%201.7%204.7%201.1-2.3h1.5%22%20stroke-width%3D%221.7%22/%3E%3C/g%3E%3C/svg%3E">
  <title>Now Monitor</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap");

    :root {
      --console-font: "JetBrains Maple Mono", "JetBrains Mono", monospace;
      --fallback-fonts: "Noto Sans SC", sans-serif;

      /* Nord Console 配色方案 */
      --bg-color: #1b1d24;
      --prompt-user: #d08770;
      --prompt-symbol: #81a1c1;
      --label-color: #ebcb8b;
      --text-color: #eceff4;
      --dim-color: #cdd6e4;
      --chip-label: #8fbcbb;
      --subtext-color: #4c566a;   /* 只用于进度条底槽，深色底上不做文字色 */

      --bar-bg: #2e3440;
      --bar-fill: #a3be8c;
      --bar-high: #bf616a;

      /* 圆环仪表：直径按部件 size 由 JS 覆盖，这里给默认值供静态引用 */
      --gauge-size: 120px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--console-font), var(--fallback-fonts) !important;
    }

    body {
      /* 宽高与内边距由 overlay 配置决定，这里只是兜底 */
      width: 2000px;
      height: 200px;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 12px 24px;
    }

    /* AIDA64 数据断了就把整条压暗，直播时一眼能看出来 */
    body.offline { opacity: 0.45; }

    /* 背景透明（canvas.transparent）：OBS 浏览器源直接透出游戏画面 */
    body.transparent { background-color: transparent; }

    /* 只剩 Windows 自带指标：轻度提示，数字还在动，不能压太暗 */
    body.degraded { opacity: 0.75; }

    .prompt-line {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .prompt-user { color: var(--prompt-user); }
    .prompt-symbol { color: var(--prompt-symbol); }
    .prompt-cmd { color: var(--text-color); }
    .cursor {
      display: inline-block;
      width: 10px;
      height: 20px;
      background-color: var(--text-color);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* minmax(0,1fr) 是必需的：默认 1fr 的最小宽度等于内容宽度，
       长文本会把列撑宽去挤相邻卡片，还会让溢出判据量到一个跟着变大的 room */
    .monitor-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 32px;
    }

    /* 自由画布（canvas.mode=free）：部件按 x/y 绝对定位 */
    body.free { display: block; }
    body.free > * { position: absolute; margin: 0; }

    .free-stat { font-weight: 700; white-space: nowrap; }
    .free-stat .tmiss { color: var(--subtext-color); }
    .free-progress .fp-track { background: var(--bar-bg); border-radius: 4px; overflow: hidden; }
    .free-progress .fp-fill { height: 100%; width: 0%; background: var(--bar-fill); }
    .free-progress.high .fp-fill { background: var(--bar-high); }
    .free-html { line-height: 1.3; }
    .free-html .tmiss { color: var(--subtext-color); }
    .free-gauge { text-align: center; }
    .free-gauge svg { display: block; }
    .free-gauge .gauge-mid {
      position: absolute; left: 0; right: 0; top: 0; height: var(--gauge-size, 120px);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: var(--text-color);
    }
    .free-gauge.high .gauge-arc { stroke: var(--bar-high) !important; }
    .free-gauge .gauge-label { display: block; margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--dim-color); }


    .metric-card {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }
    .metric-header { display: flex; justify-content: space-between; font-size: 17px; font-weight: bold; }
    .metric-label { color: var(--label-color); }
    .metric-value { color: var(--text-color); }

    .progress-bar-container { display: flex; align-items: center; gap: 8px; font-size: 15px; }
    .progress-track {
      flex: 1;
      height: var(--bar-h, 13px);
      background-color: var(--bar-bg);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--bar-fill);
      transition: width 0.4s ease, background-color 0.4s ease;
    }

    .metric-sub {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--dim-color);
      white-space: nowrap;
      overflow: hidden;
    }
    /* span 必须是滚动容器，否则 scrollWidth 恒等于 clientWidth，测不出真实内容宽度 */
    .metric-sub > span { overflow: hidden; }
    /* 值变宽时（显存 10.0GB、核心 2000MHz）降一号，宁可小一点也不越界压到相邻卡片 */
    .metric-card.tight .metric-sub { font-size: 12.5px; }

    .spark {
      display: flex;
      align-items: flex-end;
      gap: 1px;
      flex: 0 0 82px;
      height: 17px;
      background-color: var(--bar-bg);
      padding: 1px;
    }
    .spark i { flex: 1; min-height: 1px; background-color: var(--bar-fill); transition: height 0.3s ease; }

    .chips { display: flex; justify-content: space-between; gap: 18px; margin-top: 10px; font-size: 15px; }
    .chips.dense { font-size: 13px; gap: 10px; }
    .chip { flex: 0 0 auto; display: flex; gap: 6px; white-space: nowrap; overflow: hidden; }
    .chip b { color: var(--chip-label); font-weight: 400; }
    .chip span { color: var(--text-color); }
    .chip.warn span { color: var(--bar-high); }

    .text-line { font-size: 19px; color: var(--text-color); white-space: nowrap; overflow: hidden; }
    .text-line .tv { color: var(--label-color); }
    .text-line .tmiss { color: var(--subtext-color); }

    .free-value { white-space: nowrap; overflow: hidden; }
    .free-value .vn { color: var(--label-color); }
    .free-value .vv { color: var(--text-color); }
    .free-value .vwarn { color: var(--bar-high); }
    .free-value .tmiss { color: var(--subtext-color); }

    /* 原子件（Phase 3）：icon / image / divider / badge */
    .free-icon svg { display: block; }
    .free-image img { width: 100%; height: 100%; display: block; }
    .free-image .img-empty {
      display: flex; width: 100%; height: 100%;
      align-items: center; justify-content: center;
      border: 1px dashed var(--subtext-color);
      color: var(--subtext-color); font-size: 12px;
    }
    .free-divider { background: var(--dim-color); }
    .free-badge {
      display: inline-flex; align-items: center; white-space: nowrap;
      background: var(--bar-bg); border-radius: 999px; padding: 3px 12px;
    }
    .free-badge .tmiss { color: var(--subtext-color); }
  </style>
</head>
<body>
  <script>
    // 配置驱动的叠加层渲染器。三层数据来源：
    //   /hw.json      值，按输出路径取（cpu.usage）
    //   /metrics.json 怎么解读：单位、位数、量程、阈值、中文名
    //   /overlay.json 显示哪些、摆在哪（schema v2：widgets 部件数组）
    // 本文件不含任何指标清单或阈值 —— 那些都是数据。

    // 部件架构：每种 type 对应一个工厂 makeXxx(widget)，build 一次 DOM、
    // 返回 { host, update }：host 是部件根节点，build 据此定位（不再反抓
    // body 末尾），update() 在每秒刷新时重绘。与 hwobs/widgets.py 的注册表以 type 为契约：
    // 那边登记默认几何与校验，这边负责渲染；两边都不允许出现第三份遍历。
    // 新增部件 = 在 widgets.py 登记 + 在 WIDGET_TYPES 加一个工厂，两处即可。

    const REFRESH_MS = 1000;
    const HISTORY = 22;       // 迷你曲线秒数
    const SPARK_W = 82;       // 与 CSS .spark 的 flex-basis 一致
    const SUB_GAP = 8;        // 与 CSS .metric-sub 的 gap 一致
    const SUB_FONT_PX = 14;   // 与 CSS .metric-sub 的 font-size 一致
    const TEXT_REF_RX = /\{([a-zA-Z0-9_.]+)\}/g;
    // 本地伪路径：不来自传感器，渲染时本地生成（时钟这类不需要后端数据的值）
    const PSEUDO_REFS = {
      time: () => { const d = new Date(); return [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, '0')).join(':'); },
      date: () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; },
    };

    let HW = null;
    const byOut = new Map();  // 输出路径 -> 注册表条目
    // 单一采样器：指标路径 -> { buf, cap, sampled }。一帧每路径只补一个采样
    // （sampled !== tickSeq 判据），容量取所有消费者声明的最大 cap；
    // 消费方（cards 内嵌曲线 / spark / bars / HWOB.history）各自 tail 末尾 N 个。
    const sampler = new Map();
    function sample(path, cap) {
      let s = sampler.get(path);
      if (!s) { s = { buf: [], cap: 0, sampled: 0 }; sampler.set(path, s); }
      if (cap > s.cap) s.cap = cap;
      if (s.sampled !== tickSeq) {
        s.sampled = tickSeq;
        s.buf.push(HW ? dig(HW, path) : null);
        while (s.buf.length > s.cap) s.buf.shift();
      }
      return s.buf;
    }
    const tail = (buf, n) => (buf.length > n ? buf.slice(buf.length - n) : buf);
    let instances = [];
    let tickSeq = 0;          // 每次 render() 自增：一条曲线被多张卡引用时，一帧只补一个采样

    // 预览模式（/?preview=1，只有管理页会用）：布局不从 overlay.json 读，
    // 由父页面 postMessage 推送草稿，改一下推一次 —— OBS 里不带这个参数，不受影响。
    const PREVIEW = new URLSearchParams(location.search).has('preview');
    let pendingPreview = null;
    let booted = false;

    const probe = document.createElement('span');
    probe.style.cssText =
      `position:absolute;left:-9999px;visibility:hidden;white-space:nowrap;font-size:${SUB_FONT_PX}px`;

    const dig = (obj, path) => path.split('.').reduce((n, k) => (n == null ? null : n[k]), obj);
    const asRef = r => (typeof r === 'string' ? { metric: r } : r);

    function meta(r) {
      const m = byOut.get(r.metric) || {};
      return {
        unit: r.unit !== undefined ? r.unit : m.unit,
        digits: r.digits !== undefined ? r.digits : (m.digits || 0),
        divide: r.divide !== undefined ? r.divide : (m.divide || 1),
        warn: m.warn || null,
        range: m.range || null,
        name: r.name || m.name || r.metric,
      };
    }

    // 单位前加空格，% 除外：40 °C / 54.3 W / 38%
    function txt(v, mt) {
      if (v == null) return '--';
      const s = (v / mt.divide).toFixed(mt.digits);
      return mt.unit == null ? s : (mt.unit === '%' ? s + '%' : s + ' ' + mt.unit);
    }

    function plain(v, mt) {
      return v == null ? '--' : (v / mt.divide).toFixed(mt.digits);
    }

    function one(o, showUnit, showLabel) {
      const mt = meta(o);
      const v = HW ? dig(HW, o.metric) : null;
      const body = showUnit ? txt(v, mt) : plain(v, mt);
      return (showLabel && o.label ? o.label + ' ' : '') + body;
    }

    function pairText(o) {
      const vals = o.pair.map(p => (HW ? dig(HW, p) : null));
      if (vals.every(v => v == null)) return null;
      const d = o.divide || 1;
      const a = vals[0] == null ? '--' : (vals[0] / d).toFixed(o.digits || 0);
      const b = vals[1] == null ? '--' : (vals[1] / d).toFixed(o.digits2 !== undefined ? o.digits2 : (o.digits || 0));
      return `${o.label ? o.label + ' ' : ''}${a}/${b}${o.unit || ''}`;
    }

    function diffText(o) {
      const [a, b] = o.diff.map(p => (HW ? dig(HW, p) : null));
      if (a == null || b == null) return null;
      return txt(a - b, meta({ unit: o.unit, digits: o.digits, divide: o.divide }));
    }

    // 组级 unit/digits/divide 作为条目默认值，条目自己写了才覆盖
    function group(def, showLabel) {
      if (!def) return null;
      const base = { unit: def.unit, digits: def.digits, divide: def.divide };
      const last = (def.metrics || []).length - 1;
      const parts = (def.metrics || []).map((raw, i) => {
        const o = { ...base, ...asRef(raw) };
        if (o.pair) return pairText(o);
        if (o.diff) return diffText(o);
        // 条目自己的 unit_on 优先；没写再退回组级策略（last 只给最后一个带单位）
        const withUnit = o.unit_on !== undefined ? !!o.unit_on
          : (def.unit_policy !== 'last' || i === last);
        return one(o, withUnit, showLabel);
      });
      const kept = parts.filter(s => s && s !== '--');
      return kept.length ? kept.join(def.sep || ' · ') : null;
    }

    function isHigh(v, warn) {
      if (v == null || !warn) return false;
      return warn.op === '<=' ? v <= warn.value : v >= warn.value;
    }

    function el(tag, cls, children) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      for (const k of children || []) node.appendChild(k);
      return node;
    }
    const text = s => document.createTextNode(s);

    // innerHTML 拼接前的转义：指标名/单位来自用户注册表，混进 < & 这类字符时不能破坏结构。
    // text 部件走文本节点不需要它；html 部件本来就是用户全权的 HTML。
    const esc = s => String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // 几何内联应用：CSS 里的值只是无配置时的兜底，校验器算的是同一份配置数

    // 主题与样式：全部走 CSS 变量级联。主题（canvas.theme）把变量设在 body 上，
    // 组件级 style 把同名变量设在部件宿主上 —— 内联优先级天然高于 body，
    // 「全局主题 + 单组件覆盖」不需要任何优先级魔法。变量名映射见 THEME_VARS；
    // 主题清单单一来源在 hwobs/themes.py，boot 时随 /api/widgets/meta 拿到。
    const THEME_VARS = {
      bg: '--bg-color', text: '--text-color', label: '--label-color',
      chip: '--chip-label', dim: '--dim-color', subtext: '--subtext-color',
      bar_bg: '--bar-bg', bar_fill: '--bar-fill', high: '--bar-high',
      prompt_user: '--prompt-user', prompt_symbol: '--prompt-symbol',
    };
    let THEME_TABLE = {};   // 主题名 -> {label, vars}，boot 时填充；拿不到就只有渲染器内置默认

    function applyTheme(theme) {
      let vars = null;
      if (theme && typeof theme === 'object') vars = theme;
      else if (typeof theme === 'string' && THEME_TABLE[theme]) vars = THEME_TABLE[theme].vars;
      if (!vars) return;
      for (const [k, v] of Object.entries(vars)) {
        const name = THEME_VARS[k];
        if (name && typeof v === 'string' && v) document.body.style.setProperty(name, v);
      }
    }

    // #rrggbb + 独立透明度（0~100）→ rgba；其余颜色写法原样透出
    function withAlpha(color, alphaPct) {
      const m = /^#([0-9a-fA-F]{6})$/.exec(color || '');
      const a = Math.max(0, Math.min(100, alphaPct == null ? 100 : alphaPct)) / 100;
      if (!m || a >= 1) return color;
      const n = parseInt(m[1], 16);
      return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a.toFixed(3)})`;
    }

    // 组件级 style（hwobs/widgets.py 的 style_schema 是它的契约）：颜色键重定义
    // CSS 变量，bg.* 让任意组件长出卡片底。各工厂自己的特有键（brackets 等）自取。
    function applyStyle(host, w) {
      const st = w && w.style;
      if (!st || typeof st !== 'object') return;
      const set = (name, v) => host.style.setProperty(name, v);
      if (typeof st.color === 'string' && st.color) set('--text-color', st.color);
      // "名字/标签色"一个键同时管卡片标题与 chips 名字（两处原本是两个变量）
      if (typeof st.label === 'string' && st.label) { set('--label-color', st.label); set('--chip-label', st.label); }
      if (typeof st.accent === 'string' && st.accent) set('--bar-fill', st.accent);
      if (typeof st.high === 'string' && st.high) set('--bar-high', st.high);
      if (typeof st.track === 'string' && st.track) set('--bar-bg', st.track);
      // 条粗：卡片进度条轨道高度（.progress-track 消费）；进度条原子件的粗细走几何 height
      if (Number.isFinite(st.bar_h)) set('--bar-h', Math.max(2, Math.min(60, st.bar_h)) + 'px');
      if (typeof st.dim === 'string' && st.dim) set('--dim-color', st.dim);
      if (typeof st.opacity === 'number' && Number.isFinite(st.opacity)) {
        host.style.opacity = Math.max(0.05, Math.min(1, st.opacity));
      }
      const bg = st.bg;
      if (bg && typeof bg === 'object' && typeof bg.color === 'string' && bg.color) {
        host.style.backgroundColor = withAlpha(bg.color, bg.alpha);
        if (Number.isFinite(bg.radius)) host.style.borderRadius = Math.max(0, bg.radius) + 'px';
        if (Number.isFinite(bg.padding) && bg.padding > 0) host.style.padding = bg.padding + 'px';
        if (Number.isFinite(bg.border) && bg.border > 0) {
          host.style.border = bg.border + 'px solid ' +
            (typeof bg.border_color === 'string' && bg.border_color ? bg.border_color : 'rgba(255,255,255,0.12)');
        }
      }
    }

    function applyCanvas(canvas) {
      if (!canvas) return;
      applyTheme(canvas.theme);
      const free = canvas.mode === 'free';
      document.body.classList.toggle('free', free);
      document.body.classList.toggle('transparent', !!canvas.transparent);
      document.body.style.width = canvas.w + 'px';
      document.body.style.height = canvas.h + 'px';
      // 自由画布下部件用 x/y 定位，body 内边距没有意义
      document.body.style.padding =
        free ? '0' : (canvas.padding ? `${canvas.padding[0]}px ${canvas.padding[1]}px` : '');
    }

    function buildPrompt(p) {
      const line = el('div', 'prompt-line', [
        el('span', 'prompt-user', [text(p.user)]),
        el('span', 'prompt-symbol', [text('>')]),
        el('span', 'prompt-cmd', [text(p.cmd)]),
      ]);
      if (p.size) line.style.fontSize = p.size + 'px';
      if (p.cursor) line.appendChild(el('div', 'cursor'));
      line.dataset.prompt = '1';   // 编辑器拖拽手柄靠它直改这个节点的样式跟手
      document.body.appendChild(line);
    }

    // --- cards：指标卡片网格 ------------------------------------------------

    function makeCards(w) {
      const st = w.style || {};
      const brackets = st.brackets !== false;      // [ ] 装饰可关
      const sparkW = Math.max(40, Math.min(300, st.spark_w ?? SPARK_W));
      const sparkH = Math.max(10, Math.min(60, st.spark_h ?? 17));
      const states = {};
      const grid = el('div', 'monitor-grid');
      grid.style.gridTemplateColumns = `repeat(${w.cols ?? 4}, minmax(0, 1fr))`;
      grid.style.gap = (w.gap ?? 32) + 'px';
      for (const c of w.items || []) {
        const card = el('div', 'metric-card');
        card.dataset.key = c.key;
        const value = el('span', 'metric-value', [text('--')]);
        const header = el('div', 'metric-header',
          [el('span', 'metric-label', [text(c.label)]), value]);
        if (Number.isFinite(st.title_size)) header.style.fontSize = st.title_size + 'px';
        const bar = el('div', 'progress-fill');
        const subText = el('span', null, [text('--')]);
        // 迷你曲线底盒只在配了 spark 指标时才画（空深色盒子没有意义）；
        // style.spark_bg=false 去掉深底，让曲线直接浮在画布上
        const spark = c.spark ? el('div', 'spark') : null;
        if (spark) {
          spark.style.flex = `0 0 ${sparkW}px`;
          spark.style.height = sparkH + 'px';
          if (st.spark_bg === false) spark.style.background = 'transparent';
        }
        card.appendChild(header);
        // 进度条行：默认带 [ ] 括号（老观感），style.brackets=false 时只留轨道
        const barRow = el('div', 'progress-bar-container');
        if (brackets) barRow.appendChild(el('span', null, [text('[')]));
        barRow.appendChild(el('div', 'progress-track', [bar]));
        if (brackets) barRow.appendChild(el('span', null, [text(']')]));
        card.appendChild(barRow);
        card.appendChild(el('div', 'metric-sub', [...(spark ? [spark] : []), subText]));
        grid.appendChild(card);
        states[c.key] = { el: card, value, bar, subText, spark, sparkW,
                          barMetric: c.bar, barFull: c.bar_full,
                          valueDef: c.value, subDef: c.sub, sparkMetric: c.spark };
      }
      document.body.appendChild(grid);

      return {
        host: grid,
        update() {
          for (const key of Object.keys(states)) {
            const c = states[key];
            c.value.textContent = group(c.valueDef, false) || '--';
            c.subText.textContent = group(c.subDef, true) || '--';

            const m = byOut.get(c.barMetric) || {};
            const v = HW ? dig(HW, c.barMetric) : null;
            const max = c.barFull !== undefined ? c.barFull : (m.range ? m.range[1] : 100);
            const min = m.range ? m.range[0] : 0;
            const pct = v == null ? 0 : Math.max(0, Math.min(100, (v - min) / (max - min) * 100));
            c.bar.style.width = pct + '%';
            c.bar.style.backgroundColor = isHigh(v, m.warn) ? 'var(--bar-high)' : 'var(--bar-fill)';

            // 次要行宽度随数值变（显存 10.0GB、核心 2000MHz），放不下就降一号。
            // 用隐藏探针恒按正常字号量：直接量元素会在 14px/12.5px 两种状态间来回跳。
            probe.textContent = c.subText.textContent;
            const room = c.subText.parentElement.clientWidth
              - (c.sparkMetric ? c.sparkW + SUB_GAP : 0);
            c.el.classList.toggle('tight', probe.scrollWidth > room);

            if (c.sparkMetric) {
              // 同一指标被多张卡引用时 sample() 保证一帧只补一个采样
              drawSpark(c.spark, tail(sample(c.sparkMetric, HISTORY), HISTORY),
                        (byOut.get(c.sparkMetric) || {}).warn);
            }
          }
        }
      };
    }

    function drawSpark(host, hist, warn) {
      if (host.children.length !== hist.length) {
        host.replaceChildren(...hist.map(() => document.createElement('i')));
      }
      const seen = hist.filter(v => v != null);
      // 按窗口内峰值定标，否则 20% 的负载只有 2px 高，看不出形状
      const peak = Math.max(20, ...seen);
      hist.forEach((v, i) => {
        const cell = host.children[i];
        cell.style.height = v == null ? '0%' : Math.max(2, v / peak * 100) + '%';
        cell.style.backgroundColor = isHigh(v, warn) ? 'var(--bar-high)' : 'var(--bar-fill)';
      });
    }

    // --- chips：底部小指标行 --------------------------------------------------

    function makeChips(w) {
      const specs = (w.items || []).map(asRef);
      const host = el('div', 'chips');
      host.style.fontSize = (w.font ?? 15) + 'px';
      host.style.marginTop = (w.margin_top ?? 10) + 'px';
      if (w.style && Number.isFinite(w.style.gap)) host.style.gap = w.style.gap + 'px';
      host.dataset.fit = w.fit || 'none';
      document.body.appendChild(host);

      return {
        host,
        update() {
          const html = [];
          for (const s of specs) {
            const mt = meta(s);
            const v = HW ? dig(HW, s.metric) : null;
            if (v == null) continue;
            html.push(`<div class="chip${isHigh(v, mt.warn) ? ' warn' : ''}">` +
                      `<b>${esc(mt.name)}</b><span>${esc(txt(v, mt))}</span></div>`);
          }
          host.innerHTML = html.join('');
          if (host.dataset.fit === 'shrink') {
            // 传感器数量变了会挤爆这一行，缩一号也比裁掉好
            host.classList.toggle('dense', host.scrollWidth > host.clientWidth);
          }
        }
      };
    }

    // --- text：自定义文本行，{输出路径} 占位符插值 ------------------------------

    // 按 {路径} 切开：字面量与值交替。text 与 badge 共用这套编译/渲染。
    function compileParts(src) {
      const parts = [];
      let last = 0;
      const s = String(src || '');
      for (const m of s.matchAll(TEXT_REF_RX)) {
        if (m.index > last) parts.push({ lit: s.slice(last, m.index) });
        parts.push({ ref: m[1] });
        last = m.index + m[0].length;
      }
      if (last < s.length) parts.push({ lit: s.slice(last) });
      return parts;
    }

    function partsToNodes(parts) {
      return parts.map(p => {
        if (p.lit !== undefined) return text(p.lit);
        if (PSEUDO_REFS[p.ref]) {
          const pseudo = el('span', 'tv');
          pseudo.textContent = PSEUDO_REFS[p.ref]();
          return pseudo;
        }
        const v = HW ? dig(HW, p.ref) : null;
        const mt = meta({ metric: p.ref });
        const span = el('span', v == null ? 'tmiss' : 'tv');
        span.textContent = txt(v, mt);
        return span;
      });
    }

    function makeText(w) {
      const line = el('div', 'text-line');
      line.style.fontSize = (w.size ?? 19) + 'px';
      line.style.marginTop = (w.margin_top ?? 0) + 'px';
      document.body.appendChild(line);
      // 配置里就算混进了 HTML 也不会被执行（值走文本节点拼装）
      const parts = compileParts(w.text);
      return {
        host: line,
        update() {
          line.replaceChildren(...partsToNodes(parts));
        }
      };
    }

    // --- stat：单指标大数字（自由画布） ----------------------------------------

    function makeStat(w) {
      const host = el('div', 'free-stat');
      host.style.fontSize = (w.size ?? 26) + 'px';
      if (w.align) host.style.textAlign = w.align;
      document.body.appendChild(host);
      return {
        host,
        update() {
          const v = HW ? dig(HW, w.metric) : null;
          const mt = meta({ metric: w.metric });
          host.replaceChildren(
            ...(w.label ? [text(w.label + ' ')] : []),
            el('span', v == null ? 'tmiss' : 'tv', [text(txt(v, mt))]),
          );
        },
      };
    }

    // --- progress：单指标进度条，按指标量程定标（自由画布） ----------------------

    function makeProgress(w) {
      const host = el('div', 'free-progress');
      if (w.w) host.style.width = w.w + 'px';
      const track = el('div', 'fp-track');
      track.style.height = (w.height ?? 10) + 'px';
      // style.radius 覆盖圆角（schema 里的键之前没有消费者，CSS 只留 4px 兜底）
      const st = w.style || {};
      if (Number.isFinite(st.radius)) {
        track.style.borderRadius = Math.max(0, Math.min(20, st.radius)) + 'px';
      }
      const fill = el('div', 'fp-fill');
      track.appendChild(fill);
      host.appendChild(track);
      document.body.appendChild(host);
      return {
        host,
        update() {
          const v = HW ? dig(HW, w.metric) : null;
          const mt = meta({ metric: w.metric });
          let pct = 0;
          if (v != null) {
            const lo = (mt.range && mt.range[0]) || 0;
            const hi = (mt.range && mt.range[1]) || 100;
            pct = Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
          }
          fill.style.width = pct + '%';
          host.classList.toggle('high', isHigh(v, mt.warn));
        },
      };
    }

    // --- html：自定义 HTML 片段（自由画布） --------------------------------------
    // 不带 <script> 的静态片段：维持老语义，{路径} 占位符每秒整段替换。
    // 带脚本的动态片段：占位符只在构建时替换一次，<script> 重新注入使其真正
    // 执行，动态数据走脚本里拿到的 HWOB API：
    //   HWOB.get('cpu.usage')            当前原始值（没数据时 null）
    //   HWOB.text('cpu.temp')            按注册表格式化（单位/小数）
    //   HWOB.onTick(fn)                  每秒回调 fn(hw)
    //   HWOB.history('cpu.usage', 60)    最近 N 秒采样数组（每秒补一点）
    //   HWOB.root                        本部件的 DOM 根（querySelector 用它，别用 document）
    // 注意：脚本是会跑的 —— 别导入来路不明的版式文件。

    function makeWidgetApi(host) {
      const fns = [];
      // path -> { path, cap, view }：view 身份稳定（脚本拿到的数组引用不变），
      // 每帧从共享采样器取末尾 cap 个同步进来 —— 与旧双轨采样的长度语义一致。
      const series = new Map();
      return {
        root: host,
        onTick(fn) { if (typeof fn === 'function') fns.push(fn); },
        get(path) { return HW ? dig(HW, path) : null; },
        text(path) { return txt(HW ? dig(HW, path) : null, meta({ metric: path })); },
        history(path, cap = HISTORY) {
          let s = series.get(path);
          if (!s) { s = { path, cap: Math.max(2, cap | 0), view: [] }; series.set(path, s); }
          return s.view;
        },
        _emit() {
          for (const s of series.values()) {
            const fresh = tail(sample(s.path, s.cap), s.cap);
            s.view.length = 0;
            for (const v of fresh) s.view.push(v);
          }
          for (const fn of fns) {
            try { fn(HW); } catch (e) { console.warn('HWOB onTick:', e); }
          }
        },
      };
    }

    function substituteRefs(src) {
      return src.replace(TEXT_REF_RX, (whole, p) => {
        if (PSEUDO_REFS[p]) return PSEUDO_REFS[p]();
        const v = HW ? dig(HW, p) : null;
        return v == null ? whole : txt(v, meta({ metric: p }));
      });
    }

    function makeHtml(w) {
      const host = el('div', 'free-html');
      if (w.w) host.style.width = w.w + 'px';
      if (w.h) { host.style.height = w.h + 'px'; host.style.overflow = 'hidden'; }
      document.body.appendChild(host);
      const src = w.html || '';
      if (!/<script/i.test(src)) {
        // 静态片段：每秒整段重替换（没有脚本，重建无副作用）
        return {
          host,
          update() { host.innerHTML = substituteRefs(src); },
        };
      }
      // 动态片段：构建期替换一次占位符，注入并执行脚本，之后由 HWOB 驱动
      const api = makeWidgetApi(host);
      host.innerHTML = substituteRefs(src);
      for (const old of [...host.querySelectorAll('script')]) {
        const s = document.createElement('script');
        if (old.src) s.src = old.src;
        else s.textContent = old.textContent;
        window.HWOB = api;   // 脚本同步执行，此刻的 HWOB 就是自己部件的
        old.replaceWith(s);
      }
      return {
        host,
        update() { api._emit(); },
      };
    }

    // --- gauge：环形仪表（SVG 圆环，按指标量程定标） -----------------------------

    function makeGauge(w) {
      const size = Math.max(48, w.size ?? 120);
      const ring = Math.max(2, w.ring ?? 10);
      const label = typeof w.label === 'string' ? w.label : (w.label ? '' : null);
      const showValue = !(w.style && w.style.show_value === false);
      const host = el('div', 'free-gauge');
      host.style.width = size + 'px';
      host.style.setProperty('--gauge-size', size + 'px');
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('width', size);
      svg.setAttribute('height', size);
      const r = (size - ring) / 2;
      const c = 2 * Math.PI * r;
      const mk = stroke => {
        const cir = document.createElementNS(NS, 'circle');
        cir.setAttribute('cx', size / 2);
        cir.setAttribute('cy', size / 2);
        cir.setAttribute('r', r);
        cir.setAttribute('fill', 'none');
        cir.setAttribute('stroke', stroke);
        cir.setAttribute('stroke-width', ring);
        return cir;
      };
      const track = mk('var(--bar-bg)');
      const arc = mk('var(--bar-fill)');
      arc.setAttribute('class', 'gauge-arc');
      arc.setAttribute('stroke-dasharray', c);
      arc.setAttribute('stroke-dashoffset', c);
      arc.setAttribute('transform', `rotate(-90 ${size / 2} ${size / 2})`);
      svg.append(track, arc);
      const mid = el('span', 'gauge-mid');
      mid.style.fontSize = Math.max(12, Math.round(size / 5)) + 'px';
      const val = el('span', 'tv', [text('--')]);
      if (showValue) mid.appendChild(val);
      host.append(svg, mid);
      if (label !== null) {
        const lab = el('span', 'gauge-label', [text(label)]);
        host.appendChild(lab);
        host.style.height = (size + 20) + 'px';
      } else {
        host.style.height = size + 'px';
      }
      document.body.appendChild(host);
      return {
        host,
        update() {
          const v = HW ? dig(HW, w.metric) : null;
          const mt = meta({ metric: w.metric });
          let pct = 0;
          if (v != null) {
            const lo = (mt.range && mt.range[0]) || 0;
            const hi = (mt.range && mt.range[1]) || 100;
            pct = Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
          }
          arc.setAttribute('stroke-dashoffset', c * (1 - pct / 100));
          if (showValue) val.textContent = txt(v, mt);
          host.classList.toggle('high', isHigh(v, mt.warn));
        },
      };
    }

    // --- spark：独立迷你曲线（canvas 面积图，窗口内峰值定标） ----------------------
    // 颜色跟随主题/style（--bar-fill / --bar-high），每秒从画布上的计算样式现读，
    // 主题切色不用重建部件。fill=false 时只描线不填充。

    function cssVar(host, name, fallback) {
      const v = getComputedStyle(host).getPropertyValue(name).trim();
      return v || fallback;
    }

    function makeSpark(w) {
      const W = Math.max(40, w.w ?? 120);
      const H = Math.max(12, w.h ?? 32);
      const samples = Math.max(10, Math.min(300, w.samples ?? 30));
      const fill = !(w.style && w.style.fill === false);
      const host = el('div', 'free-spark');
      host.style.width = W + 'px';
      host.style.height = H + 'px';
      const cv = document.createElement('canvas');
      const dpr = window.devicePixelRatio || 1;
      cv.width = W * dpr;
      cv.height = H * dpr;
      cv.style.width = '100%';
      cv.style.height = '100%';
      host.appendChild(cv);
      document.body.appendChild(host);
      const ctx = cv.getContext('2d');
      ctx.scale(dpr, dpr);
      return {
        host,
        update() {
          drawSparkArea(cv, W, H, tail(sample(w.metric, samples), samples),
                        (byOut.get(w.metric) || {}).warn, fill);
        },
      };
    }

    function drawSparkArea(cv, W, H, hist, warn, fill) {
      const ctx = cv.getContext('2d');
      const cFill = cssVar(cv, '--bar-fill', '#a3be8c');
      const cHigh = cssVar(cv, '--bar-high', '#bf616a');
      ctx.clearRect(0, 0, W, H);
      const n = hist.length;
      if (n < 2) return;
      const seen = hist.filter(v => v != null);
      // 按窗口内峰值定标，否则 20% 的负载只有 2px 高，看不出形状
      const peak = Math.max(20, ...seen);
      const px = i => (i * W) / (n - 1);
      const py = v => H - 1 - (Math.max(0, Math.min(peak, v)) / peak) * (H - 2);
      const colorOf = v => (isHigh(v, warn) ? cHigh : cFill);
      let run = [];
      const flush = () => {
        if (!run.length) return;
        const x0 = px(run[0].i), x1 = px(run[run.length - 1].i);
        if (fill) {
          ctx.beginPath();
          ctx.moveTo(x0, H);
          for (const p of run) ctx.lineTo(px(p.i), py(p.v));
          ctx.lineTo(x1, H);
          ctx.closePath();
          ctx.globalAlpha = 0.3;
          ctx.fillStyle = colorOf(run[run.length - 1].v);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
        ctx.beginPath();
        for (let k = 0; k < run.length; k++) {
          k === 0 ? ctx.moveTo(px(run[k].i), py(run[k].v)) : ctx.lineTo(px(run[k].i), py(run[k].v));
        }
        ctx.strokeStyle = colorOf(run[run.length - 1].v);
        ctx.lineWidth = 1.5;
        ctx.stroke();
        run = [];
      };
      hist.forEach((v, i) => { v == null ? flush() : run.push({ i, v }); });
      flush();
    }

    // --- bars：柱状条原子件（自由画布） -------------------------------------------
    // 卡片内嵌迷你曲线的独立形态：canvas 直方图（1px 缝隙，窗口内峰值定标）。
    // 颜色跟随主题/style（--bar-fill / --bar-high），每秒从画布上的计算样式现读。

    function drawSparkBars(cv, W, H, hist, warn) {
      const ctx = cv.getContext('2d');
      const cFill = cssVar(cv, '--bar-fill', '#a3be8c');
      const cHigh = cssVar(cv, '--bar-high', '#bf616a');
      ctx.clearRect(0, 0, W, H);
      const n = hist.length;
      if (!n) return;
      // 按窗口内峰值定标，否则 20% 的负载只有 2px 高，看不出形状
      const peak = Math.max(20, ...hist.filter(v => v != null));
      const slot = W / n;
      hist.forEach((v, i) => {
        if (v == null) return;
        const h = Math.max(2, v / peak * (H - 1));
        ctx.fillStyle = isHigh(v, warn) ? cHigh : cFill;
        ctx.fillRect(i * slot, H - h, Math.max(1, slot - 1), h);
      });
    }

    function makeBars(w) {
      const W = Math.max(40, w.w ?? 120);
      const H = Math.max(12, w.h ?? 32);
      const samples = Math.max(10, Math.min(300, w.samples ?? 30));
      const host = el('div', 'free-bars');
      host.style.width = W + 'px';
      host.style.height = H + 'px';
      const cv = document.createElement('canvas');
      const dpr = window.devicePixelRatio || 1;
      cv.width = W * dpr;
      cv.height = H * dpr;
      cv.style.width = '100%';
      cv.style.height = '100%';
      host.appendChild(cv);
      document.body.appendChild(host);
      const ctx = cv.getContext('2d');
      ctx.scale(dpr, dpr);
      return {
        host,
        update() {
          drawSparkBars(cv, W, H, tail(sample(w.metric, samples), samples),
                        (byOut.get(w.metric) || {}).warn);
        },
      };
    }

    // --- panel：纯背景面板（自由画布） --------------------------------------------
    // 没有数据，就是一块可调底色/圆角/描边的矩形：垫在其他部件后面自己拼卡片。
    // 层级用编辑器的图层控制把它压到最底。

    function makePanel(w) {
      const host = el('div', 'free-panel');
      const bg = (w.style && w.style.bg) || {};
      host.style.backgroundColor =
        typeof bg.color === 'string' && bg.color ? withAlpha(bg.color, bg.alpha) : 'rgba(27,29,36,0.85)';
      host.style.borderRadius = (Number.isFinite(bg.radius) ? Math.max(0, bg.radius) : 12) + 'px';
      if (Number.isFinite(bg.border) && bg.border > 0) {
        host.style.border = bg.border + 'px solid ' +
          (typeof bg.border_color === 'string' && bg.border_color ? bg.border_color : 'rgba(255,255,255,0.10)');
      }
      document.body.appendChild(host);
      return { host, update() {} };
    }

    // --- value：数值组原子件（自由画布） -------------------------------------------
    // 一组指标 + 分隔符，可每项带注册表名字（show_name = chips 观感）。
    // 与 cards 的 value/sub 用同一套组定义；pair/diff 走现成的文本组装。

    function makeValue(w) {
      const host = el('div', 'free-value');
      host.style.fontSize = (w.size ?? 19) + 'px';
      if (w.align) host.style.textAlign = w.align;
      if (w.w) host.style.width = w.w + 'px';
      document.body.appendChild(host);
      const def = w.metrics || {};
      const base = { unit: def.unit, digits: def.digits, divide: def.divide };
      const refsList = (def.metrics || []).map(asRef);
      const sep = def.sep || ' · ';
      return {
        host,
        update() {
          const nodes = [];
          refsList.forEach((o, i) => {
            if (i > 0) nodes.push(text(sep));
            const mt = meta(o);
            const name = o.label ?? (w.show_name ? mt.name : null);
            if (name) {
              const n = el('span', 'vn', [text(name + ' ')]);
              nodes.push(n);
            }
            if (o.pair) {
              nodes.push(el('span', 'vv', [text(pairText(o) ?? '--')]));
              return;
            }
            if (o.diff) {
              nodes.push(el('span', 'vv', [text(diffText(o) ?? '--')]));
              return;
            }
            const v = HW ? dig(HW, o.metric) : null;
            const cls = 'vv' + (isHigh(v, mt.warn) ? ' vwarn' : '') + (v == null ? ' tmiss' : '');
            nodes.push(el('span', cls, [text(txt(v, mt))]));
          });
          host.replaceChildren(...nodes);
        },
      };
    }

    const WIDGET_TYPES = {
      cards: makeCards, chips: makeChips, text: makeText,
      stat: makeStat, progress: makeProgress, html: makeHtml,
      gauge: makeGauge, spark: makeSpark, panel: makePanel, value: makeValue,
      icon: makeIcon, image: makeImage, divider: makeDivider, badge: makeBadge,
      bars: makeBars,
    };

    // --- icon：内置线性图标原子件 ------------------------------------------------
    // 12 个 24×24 线性图标，stroke 跟随文字色（style.color → --text-color）。
    // 图标清单的校验端在 hwobs/widgets.py 的 ICON_NAMES，两边以名字为契约。

    const ICON_PATHS = {
      cpu: '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1.5v2.5M15 1.5v2.5M9 20v2.5M15 20v2.5M1.5 9H4M1.5 15H4M20 9h2.5M20 15h2.5"/>',
      temp: '<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>',
      power: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
      gauge: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
      pulse: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
      wifi: '<path d="M5 13a10 10 0 0 1 14 0"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" x2="12.01" y1="20" y2="20"/>',
      disk: '<line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/>',
      ram: '<path d="M6 19v-3M10 19v-3M14 19v-3M18 19v-3M8 11V9M16 11V9M12 11V9"/><path d="M2 15h20"/><path d="M2 7a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1Z"/>',
      clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
      alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/>',
      screen: '<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/>',
      liquid: '<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
    };

    function makeIcon(w) {
      const size = Math.max(12, Math.min(200, w.size ?? 24));
      const host = el('div', 'free-icon');
      host.style.width = size + 'px';
      host.style.height = size + 'px';
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('width', size);
      svg.setAttribute('height', size);
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke-width', '2');
      svg.setAttribute('stroke-linecap', 'round');
      svg.setAttribute('stroke-linejoin', 'round');
      // var() 只能走 CSS，不能进 presentation 属性
      svg.style.stroke = 'var(--text-color)';
      svg.innerHTML = ICON_PATHS[w.name] || ICON_PATHS.pulse;
      host.appendChild(svg);
      document.body.appendChild(host);
      return { host, update() {} };
    }

    // --- image：URL 图片原子件（cover/contain/fill；没 URL 时画虚线占位） ---------

    function makeImage(w) {
      const host = el('div', 'free-image');
      if (w.url) {
        const img = document.createElement('img');
        img.src = w.url;
        img.alt = '';
        img.draggable = false;
        img.style.objectFit = ['cover', 'contain', 'fill'].includes(w.fit) ? w.fit : 'cover';
        host.appendChild(img);
      } else {
        host.appendChild(el('div', 'img-empty', [text('IMG')]));
      }
      document.body.appendChild(host);
      return { host, update() {} };
    }

    // --- divider：分隔线原子件（横线高=thickness、竖线宽=thickness，长度走几何） ---

    function makeDivider(w) {
      const host = el('div', 'free-divider');
      const th = Math.max(1, Math.min(40, w.thickness ?? 2));
      if (w.vertical) host.style.width = th + 'px';
      else host.style.height = th + 'px';
      document.body.appendChild(host);
      return { host, update() {} };
    }

    // --- badge：药丸徽章原子件（{路径} 插值同 text；底色/描边走外观 bg） ----------
    // 工厂先给默认药丸底，applyStyle 的 bg.* 有写就覆盖 —— 不写外观就是暗色药丸。

    function makeBadge(w) {
      const host = el('div', 'free-badge');
      host.style.fontSize = (w.size ?? 15) + 'px';
      document.body.appendChild(host);
      const parts = compileParts(w.text);
      return {
        host,
        update() {
          host.replaceChildren(...partsToNodes(parts));
        }
      };
    }

    function build(layout) {
      applyCanvas(layout.canvas);
      const free = layout.canvas && layout.canvas.mode === 'free';
      if (layout.prompt) {
        buildPrompt(layout.prompt);
        if (free) {
          // 自由画布下装饰命令行也是可拖动的部件：写了 x/y 按坐标摆，没写回退内边距
          const pad = layout.canvas.padding || [12, 24];
          const pl = document.body.querySelector('.prompt-line');
          pl.style.left = (Number.isInteger(layout.prompt.x) ? layout.prompt.x : pad[1]) + 'px';
          pl.style.top = (Number.isInteger(layout.prompt.y) ? layout.prompt.y : pad[0]) + 'px';
        }
      }
      instances = [];
      (layout.widgets || []).forEach((w, i) => {
        const make = WIDGET_TYPES[w.type];
        if (!make) { console.warn('未知部件类型：' + w.type); return; }
        const inst = make(w);
        instances.push(inst);
        // 宿主从工厂返回值拿；工厂自己把根节点 append 到 body 末尾，顺序语义不变。
        // cards/chips/text 没写 w 时从 x 拉到右缘（通栏，和流式的观感衔接）；
        // margin_top 已折算进 y，这里清零避免双重偏移。
        // data-wi = 部件在数组里的下标，编辑器靠它直接改宿主样式做拖拽跟手。
        const host = inst.host;
        applyStyle(host, w);
        // 统一 Node 公共字段：visible=false 整个不画；rotation 绕部件中心旋转。
        // 每次预览推送都全量重建，不会残留上一份的变换。
        if (w.visible === false) host.style.display = 'none';
        if (Number.isFinite(w.rotation) && w.rotation) {
          host.style.transformOrigin = 'center';
          host.style.transform = `rotate(${w.rotation}deg)`;
        }
        if (free) {
          host.dataset.wi = String(i);
          host.style.left = (w.x || 0) + 'px';
          host.style.top = (w.y || 0) + 'px';
          if (w.w) host.style.width = w.w + 'px';
          if (w.h) host.style.height = w.h + 'px';
          if (!w.w && (w.type === 'cards' || w.type === 'chips' || w.type === 'text')) {
            host.style.right = '0px';
          }
          host.style.marginTop = '0px';
        }
      });
      document.body.appendChild(probe);
      if (PREVIEW) watchRects();
    }

    /** 编辑器协议：每次 build 完，把各部件渲染后的真实几何回报给管理页。
     * 编辑器在 iframe 上叠手柄，手柄位置以此为准 —— 不再靠估算。
     * 装饰命令行也一并回报：编辑器拿它当吸附目标，部件好对齐它的首部。 */
    function reportRects() {
      const rects = [];
      for (const h of document.body.querySelectorAll('[data-wi]')) {
        // 隐藏件（visible=false）量出来是 0×0，报 null 让编辑器直接不画手柄盒
        rects[+h.dataset.wi] = h.style.display === 'none' ? null : {
          x: h.offsetLeft, y: h.offsetTop, w: h.offsetWidth, h: h.offsetHeight,
        };
      }
      const pl = document.body.querySelector('.prompt-line');
      const prompt = pl
        ? { x: pl.offsetLeft, y: pl.offsetTop, w: pl.offsetWidth, h: pl.offsetHeight }
        : null;
      parent.postMessage({ type: 'hwobs-rects', rects, prompt }, '*');
    }

    /* build 那一刻几何还没定型：网络字体到位后字宽字高会变、实时数据让
       文字变长变短、chips 换行改行数 —— 宿主节点尺寸一变，编辑器的手柄盒
       就跟内容错位。用 ResizeObserver 盯住所有宿主，尺寸一变就补报一次；
       rAF 合帧，一帧内多次变化只报一条。只挪位置不改尺寸不会触发（拖动
       中宿主只改 left/top，正好不打扰编辑器的手柄）。 */
    let rectRO = null, rectRAF = 0;
    function reportRectsSoon() {
      if (rectRAF) return;
      rectRAF = requestAnimationFrame(() => { rectRAF = 0; reportRects(); });
    }
    function watchRects() {
      if (!rectRO) rectRO = new ResizeObserver(reportRectsSoon);
      rectRO.disconnect();
      document.body.querySelectorAll('[data-wi], .prompt-line').forEach(h => rectRO.observe(h));
      reportRectsSoon();
    }
    if (PREVIEW) document.fonts.ready.then(reportRectsSoon);

    function render() {
      tickSeq++;                 // 帧号推进：spark 的 sampled!==tickSeq 判据全靠它
      document.body.classList.toggle('offline', !HW);
      document.body.classList.toggle('degraded', !!(HW && HW.degraded));
      for (const inst of instances) inst.update();
    }

    function clearDom() {
      // body 里只有本 <script> 是静态的，其余都是 build 出来的节点
      for (const n of Array.from(document.body.children)) {
        if (n.tagName === 'SCRIPT') continue;
        n.remove();
      }
      instances = [];
    }

    function acceptPreview(layout) {
      pendingPreview = layout;
      if (!booted) return;
      clearDom();
      build(layout);
      render();
    }

    if (PREVIEW) {
      // 只认父页面（管理页编辑器）：比同源校验宽一点，开发态 vite(5173) 内嵌
      // 8765 的预览也能工作；推的只是版式草稿，没有敏感数据。
      window.addEventListener('message', e => {
        if (e.source !== window.parent) return;
        const d = e.data;
        if (d && d.type === 'hwobs-preview' && d.layout) acceptPreview(d.layout);
      });
    }

    async function getJSON(url) {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) throw new Error(url + ' -> ' + r.status);
      return r.json();
    }

    async function tick() {
      try { HW = await getJSON('/hw.json?_=' + Date.now()); } catch (e) { HW = null; }
      render();
    }

  async function boot() {
    // 主题清单随 meta 一起拿（单一来源在 hwobs/themes.py）；拿不到就只剩渲染器
    // 内置的 Nord 默认，canvas.theme 指向其他主题时静默回退。
    const [metrics] = await Promise.all([
      getJSON('/metrics.json'),
      getJSON('/api/widgets/meta').then(m => { THEME_TABLE = (m && m.themes) || {}; }).catch(() => {}),
    ]);
    for (const m of metrics.metrics) if (m.out) byOut.set(m.out, m);
      if (PREVIEW) {
        // 管理页可能在 metrics 加载完成前就推了第一版草稿，这里补建
        if (pendingPreview) build(pendingPreview);
      } else {
        build(await getJSON('/overlay.json'));
      }
      await tick();
      setInterval(tick, REFRESH_MS);
      booted = true;
      if (PREVIEW) {
        // 握手：告诉管理页"我准备好收草稿了"。iframe 的 load 事件会被
        // @import 的在线字体拖住好几秒，编辑器不能赌 onLoad 的时机。
        parent.postMessage({ type: 'hwobs-ready' }, '*');
      }
    }

    boot();
  </script>
</body>
</html>
